name: Frontend CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'churn-frontend/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'churn-frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./churn-frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './churn-frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run Build Check
      run: npm run build

